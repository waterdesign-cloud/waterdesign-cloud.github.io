<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { leaving: false, loaded: false };

  componentDidMount() {
    const go = () => window.PT ? window.PT.mount(this, { fallback: 4000, hero: true }) : setTimeout(go, 16);
    go();
    this._bindDrag();
  }
  _bindDrag() {
    const els = document.querySelectorAll('[data-drag-scroll]');
    this._dragN = (this._dragN || 0) + 1;
    if (els.length < 4 && this._dragN < 50) this._dragT = setTimeout(() => this._bindDrag(), 200);
    els.forEach(el => {
      if (el._drag) return; el._drag = true;
      let down = false, x0 = 0, s0 = 0;
      el.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; down = true; x0 = e.clientX; s0 = el.scrollLeft; el.style.cursor = 'grabbing'; el.setPointerCapture(e.pointerId); });
      el.addEventListener('pointermove', e => { if (down) el.scrollLeft = s0 - (e.clientX - x0); });
      const up = () => { down = false; el.style.cursor = 'grab'; };
      el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
  }
  componentWillUnmount() { clearTimeout(this._fallback); clearTimeout(this._dragT); }

  navigate(url) { window.PT ? window.PT.navigate(this, url) : (window.location.href = url); }


  renderVals() {
    return {
      people: [
        { avatar: 'assets/uiux_img_user3.webp', name: 'PlayHorny', role: 'Customer Service' },
        { avatar: 'assets/uiux_img_user4.webp', name: 'PlayHorny', role: 'Product User' }
      ],
      software: [
        { icon: 'assets/uiux_icon_figma.webp', label: 'Figma' }
      ],
      goBack: () => this.navigate('Page_UIUX.dc.html'),
      nav: (url) => this.navigate(url),
      ...(window.PT ? window.PT.cover(this) : { coverOpacity: 1, coverPointer: 'auto', leaveOpacity: 0, coverBg: '#1B1C20' })
    };
  }
}
</script>
